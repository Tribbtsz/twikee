name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 20 已被 GitHub Actions 弃用（会被强制跑在 24 上，等于没测它），
        # 22/24 是当前在维护的 LTS
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 格式与 lint 先行：最容易坏，且失败信息比 typecheck 好读
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm -r build
      - run: pnpm -r test
      # typecheck 是硬门禁：曾经 continue-on-error 让类型错误长期无人发现
      - run: pnpm -r typecheck

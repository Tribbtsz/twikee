name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 格式与 lint 先行：最容易坏，且失败信息比 typecheck 好读
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm -r build
      - run: pnpm -r test
      # typecheck 是硬门禁：曾经 continue-on-error 让类型错误长期无人发现
      - run: pnpm -r typecheck
